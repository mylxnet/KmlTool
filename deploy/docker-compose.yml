services:
  kml-viewer:
    image: ${KML_IMAGE:-registry.cn-hangzhou.aliyuncs.com/your-namespace/kml-viewer:v1.0.11}
    container_name: kml-viewer
    ports:
      - "${KML_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3